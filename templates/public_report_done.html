<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Request Sent — {{ company.name }}</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;}
body{background:#dce6f5;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1rem;}
.card{background:#fff;border-radius:12px;box-shadow:0 4px 16px rgba(0,0,0,0.12);padding:2rem 1.5rem;width:100%;max-width:480px;text-align:center;}
.icon{font-size:3.5rem;margin-bottom:1rem;}
h1{color:#2e7d32;font-size:1.5rem;margin-bottom:0.5rem;}
p{color:#555;font-size:0.95rem;line-height:1.6;margin-bottom:0.75rem;}
.wo-num{display:inline-block;background:#e8f5e9;color:#1b5e20;padding:0.4rem 1rem;border-radius:6px;font-size:1rem;font-weight:700;margin:0.5rem 0 1rem;}
.back-btn{display:inline-block;margin-top:0.5rem;padding:0.7rem 1.5rem;background:#1a237e;color:#fff;border-radius:8px;text-decoration:none;font-weight:600;font-size:0.95rem;}
</style>
</head>
<body>
<div class="card">
<div class="icon">✅</div>
<h1>Request Sent!</h1>
<p>The maintenance team at <strong>{{ company.name }}</strong> has been notified.</p>
<div class="wo-num">{{ wo.wo_number }}</div>
<p style="font-size:0.85rem;color:#888;">Save this number if you want to follow up. Maintenance will take care of it as soon as possible.</p>
<a href="/report/{{ company.slug }}" class="back-btn">Report Another Problem</a>
</div>
</body>
</html>
