{% extends 'base.html' %}
{% block title %}Error {{ code }} - Rivet's MMS{% endblock %}
{% block content %}

<div class="card" style="text-align:center;padding:3rem;">
<h2 style="font-size:3rem;color:var(--danger);">{{ code }}</h2>
<p style="font-size:1.1rem;color:#666;margin:1rem 0;">{{ message }}</p>
<a href="{{ url_for('dashboard') }}" class="btn btn-primary">← Back to Dashboard</a>
</div>

{% endblock %}
